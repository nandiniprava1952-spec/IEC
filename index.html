<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ସତର୍କ ବାଣୀ/SATARK TIPS</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1f5fbf" id="tc">
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#14211f;--mut:#5b6b68;--pri:#1f5fbf;--bd:#dbe4e2}
@media(prefers-color-scheme:dark){:root{--bg:#10181a;--card:#182326;--tx:#e8f0ee;--mut:#9db0ac;--pri:#5b9bf0;--bd:#2a3a3d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Noto Sans Oriya",Kalinga,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:10px;align-items:center}
header h1{font-size:1.05rem;margin:0;flex:1}header button{background:#fff3;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:1rem}
#updng{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000a}
#updng .bx{background:#fff;color:#1f2937;border-radius:16px;padding:22px 26px;width:min(80vw,300px);text-align:center;box-shadow:0 10px 30px #0008}
#updng .sp{width:54px;height:54px;margin:0 auto 12px;border:5px solid #dbe6f7;border-top-color:#1f5fbf;border-right-color:#ff8c1a;border-radius:50%;animation:upspin .9s linear infinite}
#updng .ln{height:6px;border-radius:3px;background:#dbe6f7;overflow:hidden;margin-top:14px}
#updng .ln i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#1f5fbf,#ff8c1a);animation:upbar 1.1s ease-in-out infinite}
@keyframes upspin{to{transform:rotate(360deg)}}
@keyframes upbar{0%{margin-left:-40%}100%{margin-left:100%}}
#upd{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;display:none;align-items:center;gap:10px;background:#1f5fbf;color:#fff;border:2px solid #ff8c1a;border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px #0006;font-size:.9rem;line-height:1.3}
#upd span{flex:1}
#upd button{font:inherit;font-weight:700;border-radius:10px;border:0;padding:8px 12px;cursor:pointer}
#upd .go{background:#ff8c1a;color:#1f2937}
#upd .x{background:transparent;color:#fff;padding:8px 6px;font-size:1.1rem}
#off{display:none;background:#b45309;color:#fff;text-align:center;font-size:.85rem;padding:4px}
main{max-width:900px;margin:0 auto;padding:12px}
input[type=search]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;gap:2px;min-height:118px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left;color:var(--tx);cursor:pointer;font:inherit}
.card .or{font-size:1.1rem;font-weight:800;line-height:1.3;color:var(--pri);margin-top:6px}.card .en{font-size:.78rem;color:var(--mut);font-weight:400}
.cnt{position:absolute;top:10px;right:10px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--pri);color:#fff;font:700 .8rem/26px system-ui,sans-serif;text-align:center}
.card .ic{font-size:1.9rem;line-height:1}.sub{color:var(--mut)}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.th{width:64px;height:64px;border-radius:8px;background:var(--bd);object-fit:cover;flex:none;display:grid;place-items:center;font-size:1.6rem}
.item b{display:block;font-size:.95rem}.badge{font-size:.7rem;background:var(--pri);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
video,audio{width:100%;margin-top:8px;border-radius:8px}
#lb{position:fixed;inset:0;background:#000;display:none;z-index:9;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
#lb img{display:block;margin:0 auto;width:100%;max-width:none;height:100vh;height:100dvh;object-fit:contain}#lb button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;font-size:1.4rem;background:#fff;border:0;border-radius:50%;width:40px;height:40px}
.tip{background:var(--card);border-left:4px solid var(--pri);padding:8px 12px;border-radius:8px;margin:0 0 12px;font-size:.85rem;color:var(--mut)}
#cover{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;z-index:20;background:#1f5fbf;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:stretch;text-align:center;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
#cover .fg{display:block;width:100%;height:auto;flex:none;margin:0}
#cover .fg+.fg{margin-top:4px}
#cover .ov{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 0 0;line-height:1.2}
#cover h3{margin:0;font-size:2.6rem;line-height:1.25;font-weight:800;color:#ff8c1a;text-shadow:0 2px 6px #0006}
#cover h2{margin:0;font-size:.95rem;font-weight:700;letter-spacing:.18em;color:#ff8c1a;text-shadow:0 2px 6px #0006}
#cover p{margin:0;font-size:.95rem;font-weight:700;color:#ff8c1a;text-shadow:0 2px 6px #0006}
#cover .cv{display:flex;flex-direction:column;align-items:center;margin:0;padding:0 16px}
#cover button{background:#1f5fbf;color:#ff8c1a;border:2px solid #ff8c1a;border-radius:12px;padding:12px 32px;font:inherit;font-size:1.05rem;font-weight:700;margin-top:14px}
#pv{position:fixed;inset:0;z-index:15;background:#2b2f33;display:none;flex-direction:column}
.pvb{background:var(--pri);color:#fff;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.pvb span{flex:1;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvb button,.pvb a{background:#fff3;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:1.05rem;text-decoration:none}
#pvc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
#pvi{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:100%;width:max-content}
#pvi .pg{background:#fff;box-shadow:0 1px 6px #0006}#pvi canvas{width:100%;height:100%;display:block}#pvi .msg{color:#fff;padding:24px;text-align:center}#pvi .msg a{color:#8fd4f3}
html{-webkit-text-size-adjust:100%}body{overscroll-behavior-y:contain;line-height:1.5}
*{-webkit-tap-highlight-color:transparent}button,.item,.card,a{touch-action:manipulation}
header{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
header button,.pvb button,.pvb a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
[hidden]{display:none!important}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card:active,.item:active{transform:scale(.98);background:var(--bd)}
.item{padding:10px;gap:12px;min-height:84px}.th{width:72px;height:72px;border-radius:10px}
.item b{font-size:1rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item small{display:block;font-size:.9rem;color:var(--mut)}
#lb button{width:44px;height:44px;background:#0009;color:#fff;font-size:1.2rem;box-shadow:0 0 0 1px #fff6}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
header,.pvb{background:#1f5fbf}
#ttl{cursor:pointer}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:60;background:#1f5fbf;color:#fff;border:2px solid #ff8c1a;border-radius:14px;padding:12px 18px;box-shadow:0 6px 20px #0006;font-size:.95rem;line-height:1.35;text-align:center;max-width:90vw;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
</style></head><body>
<div id="cover"><img class="fg" src="icons/cover-full.jpg" alt="ASHA workers"><img class="fg" src="icons/cover-asha-cycle.jpg" alt="ASHA worker on a bicycle"><div class="cv"><div class="ov"><h3>ସତର୍କ ବାଣୀ</h3><h2>SATARK TIPS</h2><p>by ଆଶା (ASHA)</p></div><button id="go">Open / ଖୋଲନ୍ତୁ</button></div></div>
<header><button id="back" hidden aria-label="Back">←</button><h1 id="ttl">ସତର୍କ ବାଣୀ/SATARK TIPS</h1><button id="home" aria-label="Home" title="Home">🏠</button><button id="inst" hidden title="Install app" aria-label="Install app">📲</button><button id="save" title="Save for offline">⬇ Offline</button></header>
<div id="toast" role="status" aria-live="polite">✅ <b>Updated successfully</b><br>ଅପଡେଟ୍ ସଫଳ ହେଲା</div><div id="updng" role="status" aria-live="polite"><div class="bx"><div class="sp"></div><b>Updating… / ଅପଡେଟ୍ ହେଉଛି…</b><div class="ln"><i></i></div></div></div><div id="upd" role="alert"><span>🔔 New update available<br>ନୂଆ ଅପଡେଟ୍ ଉପଲବ୍ଧ</span><button class="go">Update / ଅପଡେଟ୍</button><button class="x" aria-label="Later">✕</button></div><div id="off">Offline / ଅଫଲାଇନ୍ — showing saved content</div>
<main id="app"></main>
<div id="pv"><div class="pvb"><button id="pvx" aria-label="Close">✕</button><span id="pvt"></span><button id="pvm" aria-label="Zoom out">−</button><button id="pvp" aria-label="Zoom in">＋</button><a id="pvd" download="document.pdf" aria-label="Download">⬇</a></div><div id="pvc"><div id="pvi"></div></div></div>
<div id="lb"><button aria-label="Close">✕</button><img alt=""></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),ICON={asha:'💰',pregnancy:'🤰',newborn:'👶',breastfeeding:'🍼',family_planning:'👨‍👩‍👧',disease_awareness:'📢',leprosy:'🖐',scd:'🩸',eye:'👁',adolescent_health:'🧑‍🎓',amlan:'💊',cancer_awareness:'🎗',heatstroke:'☀️',tuberculosis:'🫁',immunization:'💉',ors_diarrhea:'🥤',pneumonia:'😷',disaster_safety:'⛑',blood_donation:'🩸',nutrition:'🥗',video_gallery:'🎬',audio_gallery:'🎧'},TI={image:'🖼',pdf:'📄',video:'▶️',audio:'🎧'};
let D;
$('#go').onclick=()=>{$('#cover').style.display='none';$('#tc').content='#1f5fbf'};
function showCover(){closePv();closeLb();const c=$('#cover');c.style.display='';c.scrollTop=0;$('#tc').content='#1f5fbf'}
$('#home').onclick=()=>{closePv();closeLb();$('#cover').style.display='none';if(location.hash)location.hash='';else route();scrollTo(0,0)};
$('#ttl').onclick=()=>{if(!/^#s=/.test(location.hash))showCover()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=o=>`<b>${esc(o.en)}</b><small>${esc(o.or)}</small>`;
async function init(){
  try{CJ=await (await fetch('content.json')).text();D=JSON.parse(CJ)}catch(e){app.innerHTML='<p>Could not load content. Connect to the internet once.</p>';return}
  addEventListener('hashchange',route);route();
}
function route(){
  const h=location.hash.slice(1),m=h.match(/^s=(.+)/);
  $('#back').hidden=!m;$('#ttl').textContent=m?'':'ସତର୍କ ବାଣୀ/SATARK TIPS';
  m?section(decodeURIComponent(m[1])):home();scrollTo(0,0);
}
function home(){
  app.innerHTML=`<input type=search id=q placeholder="Search / ଖୋଜନ୍ତୁ…"><div id=res><div class=tip>📶 Tap “⬇ Offline” once to save everything for use without internet. / ଇଣ୍ଟରନେଟ୍ ବିନା ବ୍ୟବହାର ପାଇଁ ଥରେ “⬇ Offline” ଦବାନ୍ତୁ।</div><div class=grid>`+
  D.sections.map(s=>`<button class=card onclick="location.hash='s='+'${s.id}'"><span class=ic>${ICON[s.id]||'📁'}</span><span class=cnt title="${s.items.length} items">${s.items.length}</span><b class=or>${esc(s.or||s.en)}</b><span class=en>${esc(s.en)}</span></button>`).join('')+`</div></div>`;
  $('#q').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();if(!q){home();$('#q').focus();return}
    const hits=D.sections.flatMap(s=>s.items.map(i=>({...i,sid:s.id}))).filter(i=>(i.en+' '+i.or).toLowerCase().includes(q));
    $('#res').innerHTML=hits.length?hits.map(itemHTML).join(''):'<p class=sub>No results / କିଛି ମିଳିଲା ନାହିଁ</p>';bind($('#res'),hits)};
}
function section(id){
  const s=D.sections.find(x=>x.id===id);if(!s)return home();
  $('#ttl').textContent=s.en;app.innerHTML=`<p class=sub>${esc(s.or)}</p><div id=list>${s.items.map(itemHTML).join('')}</div>`;bind(app,s.items);
}
function itemHTML(i,n){
  const th=i.thumb?`<img class=th loading=lazy src="${esc(i.thumb)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'th',textContent:'${TI[i.t]}'}))">`:`<div class=th>${TI[i.t]}</div>`;
  return `<div class=item data-u="${esc(i.url)}" data-t="${i.t}"><div>${th}</div><div style="flex:1;min-width:0">${lab(i).replace('<b>','<b><span class=badge>'+i.t.toUpperCase()+'</span> ')}<span class=slot></span></div></div>`}
function bind(root,items){root.querySelectorAll('.item').forEach(el=>el.onclick=()=>open(el))}
async function open(el){
  const u=el.dataset.u,t=el.dataset.t;
  if(t==='image'){ovOpen();$('#lb img').src=u;$('#lb').style.display='block'}
  else if(t==='video'||t==='audio'){const sl=el.querySelector('.slot');if(sl.firstChild){sl.innerHTML='';return}
    sl.innerHTML=`<${t} controls playsinline preload=metadata src="${u}" onclick="event.stopPropagation()"></${t}>`}
  else openPdf(u,el.querySelector('b').textContent)
}
let pdf=null,zoom=1,tok=0;
function loadLib(){return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='lib/pdf.min.js';e.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';ok()};e.onerror=no;document.head.append(e)})}
const pvi=$('#pvi'),pvc=$('#pvc');
async function openPdf(u,title){
  ovOpen();
  $('#pv').style.display='flex';$('#pvt').textContent=title;zoom=1;pvi.innerHTML='<div class=msg>Loading… / ଲୋଡ୍ ହେଉଛି…</div>';
  try{
    await loadLib();const r=await fetch(u);if(!r.ok)throw 0;const ab=await r.arrayBuffer();
    $('#pvd').href=URL.createObjectURL(new Blob([ab],{type:'application/pdf'}));
    if(pdf)pdf.destroy();pdf=await pdfjsLib.getDocument({data:ab.slice(0)}).promise;await draw();
  }catch(e){pvi.innerHTML='<div class=msg>Could not load this PDF. Connect to the internet and try again.<br>ପିଡିଏଫ୍ ଲୋଡ୍ ହୋଇପାରିଲା ନାହିଁ।<br><br><a href="'+esc(u)+'" target=_blank rel=noopener>Open directly ↗</a></div>'}
}
async function draw(){
  const my=++tok;pvi.innerHTML='';const p1=await pdf.getPage(1),v=p1.getViewport({scale:1});
  const W=Math.min(pvc.clientWidth-16,900)*zoom,H=W*v.height/v.width;
  const io=new IntersectionObserver(es=>es.forEach(async en=>{
    if(!en.isIntersecting)return;const d=en.target;io.unobserve(d);if(my!==tok)return;
    const pg=await pdf.getPage(+d.dataset.n),v1=pg.getViewport({scale:1}),k=W/v1.width,q=Math.min(devicePixelRatio||1,2),vp=pg.getViewport({scale:k*q});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;d.style.height=W*v1.height/v1.width+'px';d.append(c);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }),{root:pvc,rootMargin:'800px 0px'});
  for(let n=1;n<=pdf.numPages;n++){const d=document.createElement('div');d.className='pg';d.dataset.n=n;d.style.width=W+'px';d.style.height=H+'px';pvi.append(d);io.observe(d)}
}
function closePv(){tok++;$('#pv').style.display='none';pvi.innerHTML=''}
const ovOpen=()=>history.pushState({ov:1},''),ovBack=f=>history.state&&history.state.ov?history.back():f();
$('#pvx').onclick=()=>ovBack(closePv);
function closeLb(){$('#lb').style.display='none';$('#lb img').removeAttribute('src')}
addEventListener('popstate',()=>{closePv();closeLb()});
$('#pvp').onclick=()=>{if(pdf&&zoom<3){zoom+=.5;draw()}};$('#pvm').onclick=()=>{if(pdf&&zoom>1){zoom-=.5;draw()}};
$('#lb').onclick=()=>ovBack(closeLb);
$('#back').onclick=()=>history.length>1?history.back():location.hash='';
$('#save').onclick=async()=>{
  const urls=[...new Set(D.sections.flatMap(s=>s.items.flatMap(i=>i.t==='image'||i.t==='pdf'?[i.url,i.thumb]:[i.thumb])).filter(Boolean))];
  const b=$('#save');let n=0,fail=0;b.disabled=true;
  for(let i=0;i<urls.length;i+=4)await Promise.all(urls.slice(i,i+4).map(u=>fetch(u,{mode:u.endsWith('.pdf')?'cors':'no-cors'}).catch(()=>fail++).finally(()=>{b.textContent=`⬇ ${++n}/${urls.length}`})));
  b.disabled=false;b.textContent='⬇ Offline';alert(fail?`Saved with ${fail} failures — try again on better network.`:'Saved for offline use ✓ / ଅଫଲାଇନ୍ ପାଇଁ ସେଭ୍ ହେଲା');
};
let dip,CJ='';const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').hidden=isApp()});
$('#inst').onclick=async()=>{if(!dip)return;dip.prompt();const r=await dip.userChoice;dip=null;if(r.outcome==='accepted')$('#inst').hidden=true};addEventListener('appinstalled',()=>{dip=null;$('#inst').hidden=true});matchMedia('(display-mode: standalone)').addEventListener&&matchMedia('(display-mode: standalone)').addEventListener('change',()=>{if(isApp())$('#inst').hidden=true});
const upd=()=>$('#off').style.display=navigator.onLine?'none':'block';addEventListener('online',upd);addEventListener('offline',upd);upd();
let updAct=null,reloading=false;
const UF='satark_updated',setUF=()=>{try{localStorage.setItem(UF,'1')}catch(e){}};
function showUpdated(){try{if(!localStorage.getItem(UF))return;localStorage.removeItem(UF)}catch(e){return}
  const t=$('#toast');setTimeout(()=>t.classList.add('on'),400);t.onclick=()=>t.classList.remove('on');setTimeout(()=>t.classList.remove('on'),5000)}
function showUpd(fn){updAct=fn;$('#upd').style.display='flex'}
$('#upd .go').onclick=()=>{setUF();$('#upd').style.display='none';$('#updng').style.display='flex';setTimeout(()=>location.reload(),12000);updAct&&updAct()};
$('#upd .x').onclick=()=>{$('#upd').style.display='none'};
async function checkContent(){if(!navigator.onLine||!CJ)return;try{const t=await (await fetch('content.json',{cache:'no-store'})).text();if(t&&t!==CJ){try{JSON.parse(t)}catch(e){return}showUpd(()=>location.reload())}}catch(e){}}
if('serviceWorker'in navigator){
  addEventListener('load',async()=>{
    try{
      const hadCtl=!!navigator.serviceWorker.controller;
      const reg=await navigator.serviceWorker.register('sw.js');
      const ask=w=>showUpd(()=>w.postMessage('SKIP_WAITING'));
      const track=w=>w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)});
      if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
      reg.addEventListener('updatefound',()=>track(reg.installing));
      const chk=()=>{if(navigator.onLine){reg.update().catch(()=>{});checkContent()}};
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
      setInterval(chk,30*60*1000);
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;if(hadCtl)setUF();reloading=true;location.reload()});
    }catch(e){}
  });
}
showUpdated();init();
</script></body></html>
